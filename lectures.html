<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b2033"><title>Security & Cryptography Lectures</title><style>
:root{--deep:#2b2033;--plum:#725f76;--mauve:#9c8199;--coral:#d58f89;--blush:#f2cbc7;--paper:#fffafb;--line:#e4d1da;--muted:#746a73}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--deep)}body{background:linear-gradient(145deg,#f2cbc7,#fffafb 52%,#e9dce5)}header{min-height:104px;padding:14px 20px;background:linear-gradient(120deg,var(--deep),var(--plum) 62%,var(--coral));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:white;border-bottom:3px solid var(--blush)}h1{margin:0;font-size:clamp(23px,3vw,37px)}.sub{color:var(--blush);font:800 12px monospace}.nav,.lecture-btn,.control{border:1px solid #cbb0bd;background:var(--paper);color:var(--deep);border-radius:12px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}.nav.active,.lecture-btn.active{color:#fff;background:linear-gradient(135deg,var(--mauve),var(--plum))}.topnav,.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.layout{height:calc(100vh - 107px);display:grid;grid-template-columns:240px 1fr}.sidebar{padding:12px;background:#f0e1e7;border-right:1px solid var(--line);overflow:auto}.lecture-btn{display:block;width:100%;text-align:left;margin:6px 0}.workspace{min-width:0;padding:10px;display:flex;flex-direction:column}.controls{min-height:48px;justify-content:space-between}.viewer{flex:1;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white;box-shadow:0 16px 34px #2b203326}.viewer iframe{width:100%;height:100%;border:0}.notice{height:100%;display:grid;place-content:center;text-align:center;padding:25px;color:var(--muted)}@media(max-width:760px){.layout{height:auto;min-height:calc(100vh - 130px);grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:7px}.lecture-btn{min-width:130px}.workspace{height:78vh}}
</style></head><body><header><div><h1>Security &amp; Cryptography</h1><div class="sub">EMBEDDED LECTURE PRESENTATION VIEWER</div></div><nav class="topnav"><a class="nav" href="index.html">Ebook</a><a class="nav active" href="lectures.html">Lectures</a><a class="nav" href="lab-manual.html">Lab Manual</a><a class="nav" href="studio.html">Learning Activities</a></nav></header><div class="layout"><aside class="sidebar" id="list"></aside><main class="workspace"><div class="controls"><strong id="title">Lecture 1</strong><span><button class="control" onclick="prev()">← Previous</button><button class="control" onclick="next()">Next →</button><a class="control" id="full" target="_blank">Open full screen</a></span></div><section class="viewer" id="viewer"><div class="notice"><h2>Select a lecture</h2><p>The converted PDF presentation will open here without downloading.</p></div></section></main></div><script>
const lectures=Array.from({length:9},(_,i)=>({n:i+1,title:`Lecture ${i+1}`,file:`Lecture_${String(i+1).padStart(2,'0')}_Presentation.pdf`}));let current=0,list=document.getElementById('list'),viewer=document.getElementById('viewer'),title=document.getElementById('title'),full=document.getElementById('full');list.innerHTML=lectures.map((x,i)=>`<button class="lecture-btn" onclick="openLecture(${i})">${x.title}<br><small>Open presentation</small></button>`).join('');function openLecture(i){current=i;let x=lectures[i];title.textContent=x.title;full.href=x.file;viewer.innerHTML=`<iframe src="${x.file}#toolbar=1&navpanes=0&view=FitH" title="${x.title}"></iframe>`;document.querySelectorAll('.lecture-btn').forEach((b,j)=>b.classList.toggle('active',j===i))}function prev(){openLecture((current-1+lectures.length)%lectures.length)}function next(){openLecture((current+1)%lectures.length)}openLecture(0);
</script></body></html>
