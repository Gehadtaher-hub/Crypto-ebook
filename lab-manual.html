<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111f"><title>Security & Cryptography Lab Manual</title><style>:root{--ink:#edf6ff;--cyan:#38c6d9;--violet:#8b7cf6;--gold:#e7b85c;--muted:#b6c8dc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 12% 0,#243b63 0,transparent 30%),radial-gradient(circle at 90% 2%,#352b59 0,transparent 28%),linear-gradient(145deg,#0c1628,#111f35 55%,#171b31)}header{padding:14px 20px;background:linear-gradient(120deg,#101d33f5,#172a46f5,#24203ef5);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold)) 1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(21px,4vw,34px)}.sub{color:#81dce8;font:800 12px monospace}.actions,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.toolbar button,.toolbar input{background:#192d49;color:var(--ink);border:1px solid #58799c;border-radius:12px;padding:10px 14px;font-weight:800;text-decoration:none}.btn.active{background:linear-gradient(135deg,#0f9f91,#376bc7)}main{padding:10px}.toolbar{justify-content:center;margin-bottom:8px;color:var(--muted)}.toolbar input{width:72px}.shell{height:calc(100vh - 155px);min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}.flip-book{display:none;filter:drop-shadow(0 20px 30px #000a)}.page{background:#fff;overflow:hidden}.page canvas{width:100%;height:100%;object-fit:contain}.loading{background:#172a46;border:1px solid #58799c;border-radius:20px;padding:32px;text-align:center}.spinner{width:42px;height:42px;margin:auto;border:4px solid #58799c;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){header{padding:10px}.shell{height:calc(100vh - 215px)}.hint{display:none}.btn,.toolbar button{font-size:12px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><h1>Security & Cryptography Lab Manual</h1><div class="sub">INTERACTIVE FLIP BOOK · WITH SOLUTIONS</div></div><div class="actions"><a class="btn" href="index.html">📖 Ebook</a><a class="btn active" href="lab-manual.html">🧪 Lab Manual</a><a class="btn" href="studio.html">Learning Activities</a></div></header><main><div class="toolbar"><button id="prev" disabled>← Previous</button><span id="status">Loading…</span><span class="hint">Drag a page corner or use the buttons</span><button id="next" disabled>Next →</button><label>Page <input id="pageNo" type="number" min="1" value="1" disabled></label></div><div class="shell"><div id="loading" class="loading"><div class="spinner"></div><p>Loading lab manual…</p></div><div id="book" class="flip-book"></div></div></main><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file='Security-Cryptography-Lab-Manual-With-Solutions.pdf',root=document.getElementById('book'),loading=document.getElementById('loading'),statusEl=document.getElementById('status');let doc,flip,total=0;(async()=>{try{doc=await pdfjsLib.getDocument(file).promise;total=doc.numPages;pageNo.max=total;for(let n=1;n<=total;n++){statusEl.textContent='Preparing page '+n+' of '+total;let pg=await doc.getPage(n),vp=pg.getViewport({scale:1.3}),c=document.createElement('canvas'),d=document.createElement('div');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);root.appendChild(d)}loading.style.display='none';root.style.display='block';flip=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:250,maxWidth:650,minHeight:340,maxHeight:780,showCover:true,usePortrait:true,mobileScrollSupport:false,drawShadow:true,flippingTime:650});flip.loadFromHTML(root.querySelectorAll('.page'));flip.on('flip',e=>{pageNo.value=e.data+1;statusEl.textContent='Page '+(e.data+1)+' of '+total});prev.disabled=next.disabled=pageNo.disabled=false;statusEl.textContent='Page 1 of '+total}catch(e){loading.innerHTML='<h2>Lab manual could not be loaded</h2><p>Upload the PDF beside lab-manual.html with the exact name:</p><b>'+file+'</b>';statusEl.textContent='File unavailable'}})();prev.onclick=()=>flip&&flip.flipPrev();next.onclick=()=>flip&&flip.flipNext();pageNo.onchange=()=>flip&&flip.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1);</script></body></html>
