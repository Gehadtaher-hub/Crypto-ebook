<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111f"><title>Learning Activities</title><style>
:root{--ink:#edf6ff;--navy:#101d33;--navy2:#172a46;--blue:#4f8cff;--cyan:#38c6d9;--violet:#8b7cf6;--gold:#e7b85c;--green:#58ce9b;--red:#ff7789;--panel:#16263e;--panel2:#1b2f4b;--line:#3e5a78;--muted:#b6c8dc}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,Segoe UI,system-ui,sans-serif;background:radial-gradient(circle at 8% 0,#243b63 0,transparent 28%),radial-gradient(circle at 94% 2%,#352b59 0,transparent 30%),linear-gradient(145deg,#0c1628,#111f35 52%,#171b31);min-height:100vh}
header{background:linear-gradient(120deg,#101d33f5,#172a46f5,#24203ef5);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold)) 1;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 28px #0006}h1{margin:0;color:#f4f8ff}.btn,.nav{border:1px solid #58799c;background:#192d49;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px #0003;transition:.2s}.btn:hover,.nav:hover{transform:translateY(-1px);border-color:var(--cyan)}.primary,.nav.active{color:#fff;background:linear-gradient(135deg,#376bc7,#6c58cf);border-color:#8aa5ff;box-shadow:0 8px 18px #0004}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}aside{padding:10px;background:#101d33e8;border-right:1px solid #344e6d;overflow:auto;backdrop-filter:blur(8px)}.nav{display:block;width:100%;text-align:left;margin:5px 0}main{width:min(1100px,100%);padding:18px;margin:auto}
.card,.box,.question{background:linear-gradient(145deg,#1b2f4b,#14243a);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 14px 32px #0004}.card>h2,.box>h3{color:#a8d8ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .box:nth-child(4n+1){border-top:4px solid var(--cyan)}.grid .box:nth-child(4n+2){border-top:4px solid var(--violet)}.grid .box:nth-child(4n+3){border-top:4px solid var(--gold)}.grid .box:nth-child(4n){border-top:4px solid var(--blue)}.row{display:flex;gap:8px;flex-wrap:wrap}.option{display:block;padding:12px;border:1px solid #4a6685;background:#172a46;border-radius:12px;margin:8px 0}.option:hover{border-color:var(--cyan);background:#1c3553}
select,input,textarea{width:100%;padding:11px;margin:6px 0;background:#0e1b2e;color:var(--ink);border:1px solid #58799c;border-radius:10px;font-size:16px}select:focus,input:focus,textarea:focus{outline:3px solid #38c6d933;border-color:var(--cyan)}textarea{min-height:105px}.big{font-size:32px;color:#aaa0ff;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.trace{border-left:5px solid var(--violet);background:#0e1b2e;padding:12px;margin-top:8px;font-family:ui-monospace,monospace;color:#dbe8f5;border-radius:8px}.menu{display:none}
@media(max-width:760px){header{align-items:flex-start}.layout{display:block}aside{display:none;grid-template-columns:1fr 1fr;border-right:0;border-bottom:1px solid #344e6d}.open{display:grid}.menu{display:inline-block}main{padding:10px}.nav{text-align:center;font-size:12px}}
</style></head><body><header><div><h1>Learning Activities</h1><small style="color:var(--cyan)">DISCOVER · EXPERIMENT · MASTER</small></div><div class="row"><button id="menu" class="btn menu">☰ Activities</button><a class="btn" href="index.html">Back to Ebook</a></div></header><div class="layout"><aside id="nav"></aside><main id="app"><section class="card"><h2>Initializing activities…</h2></section></main></div><script>'use strict';let bank=[],s=null,timer=null,reports=[];const app=document.getElementById('app'),nav=document.getElementById('nav');const pages=[['Dashboard',home],['Study Notes',notes],['Practice',()=>setup('practice')],['Cipher Playground',ciphers],['Crypto Calculations',calculations],['Hash Laboratory',hashLab],['Attack Scenarios',scenarios],['Key Management Lab',keyLab],['Certificate Explorer',certLab],['Access-Control Designer',accessLab],['Timed Exam',()=>setup('exam')],['Question Review',review],['Instructor Dashboard',instructor],['Mastery',mastery],['Glossary',glossary],['Achievements',achievements],['Reports',showReports],['Profile',profile]];pages.forEach(([n,f],i)=>{let b=document.createElement('button');b.className='nav'+(i?'':' active');b.textContent=n;b.onclick=()=>{clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');nav.classList.remove('open');f()};nav.appendChild(b)});menu.onclick=()=>nav.classList.toggle('open');function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sample(n,t){return shuffle(bank.filter(q=>!t||q.topic===t)).slice(0,n)}function topics(){return [...new Set(bank.map(q=>q.topic))].sort()}function home(){app.innerHTML='<section class="card"><h2>Security Operations Dashboard</h2><p>Explore cryptography through guided lessons, interactive experiments, scenarios, and assessments.</p><div class="grid"><div class="box"><h3>Cryptography Lab</h3><p>Experiment with classical ciphers, hashes, and modular arithmetic.</p></div><div class="box"><h3>Security Analysis</h3><p>Map threats to services, mechanisms, and controls.</p></div><div class="box"><h3>Assessment</h3><p>Practice by topic, take timed exams, and review progress.</p></div></div></section>'}function notes(){app.innerHTML='<section class="card"><h2>Study Notes</h2>'+topics().map(t=>'<div class="box"><h3>'+t+'</h3><p>Review definitions, mechanisms, assumptions, security properties, common mistakes, and implementation requirements for '+t+'.</p></div>').join('')+'</section>'}function setup(kind){app.innerHTML='<section class="card"><h2>'+(kind==='exam'?'Timed Security Exam':'Guided Practice')+'</h2><label>Topic<select id="topic"><option value="">All Topics</option>'+topics().map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Session<select id="count"><option value="10">Quick</option><option value="20" selected>Standard</option><option value="30">Extended</option></select></label>'+(kind==='exam'?'<label>Duration<select id="mins"><option>20</option><option selected>40</option><option>60</option></select></label>':'')+'<button id="start" class="btn primary">Begin</button><div id="area"></div></section>';start.onclick=()=>{s={kind,items:sample(+count.value,topic.value),i:0,answers:[],checked:[],sec:kind==='exam'?+mins.value*60:0};render();if(kind==='exam')timer=setInterval(()=>{s.sec--;let c=document.getElementById('clock');if(c)c.textContent=fmt(s.sec);if(s.sec<=0)finish()},1000)}}function fmt(v){return Math.floor(Math.max(0,v)/60)+':'+String(Math.max(0,v)%60).padStart(2,'0')}function render(){let q=s.items[s.i],a=document.getElementById('area'),opts=q.options.map((o,j)=>'<label class="option"><input type="radio" name="a" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+o+'</label>').join(''),fb=s.kind==='practice'&&s.checked[s.i]!==undefined?'<p class="'+(s.checked[s.i]?'good':'bad')+'">'+(s.checked[s.i]?'Correct. ':'Try again. ')+q.explanation+'</p>':'';a.innerHTML='<div class="question">'+(s.kind==='exam'?'<span id="clock" class="big">'+fmt(s.sec)+'</span> · ':'')+'Question '+(s.i+1)+' of '+s.items.length+' · '+q.topic+'<h2>'+q.question+'</h2>'+opts+fb+'<div class="row"><button id="p" class="btn">Previous</button>'+(s.kind==='practice'?'<button id="check" class="btn primary">Check</button>':'')+'<button id="n" class="btn">Next</button><button id="done" class="btn">Finish</button></div></div>';a.querySelectorAll('input').forEach(r=>r.onchange=()=>s.answers[s.i]=+r.value);p.onclick=()=>{s.i=Math.max(0,s.i-1);render()};n.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);render()};if(s.kind==='practice')check.onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer');s.checked[s.i]=s.answers[s.i]===q.answer;render()};done.onclick=finish}function finish(){clearInterval(timer);let score=s.items.reduce((x,q,i)=>x+(s.answers[i]===q.answer),0),pct=Math.round(score/s.items.length*100);reports.unshift({date:new Date(),type:s.kind,score,total:s.items.length,pct});area.innerHTML='<div class="box"><div class="big">'+score+' / '+s.items.length+'</div><p>'+pct+'%</p></div>'}function ciphers(){app.innerHTML='<section class="card"><h2>Cipher Playground</h2><div class="grid"><div class="box"><h3>Caesar Cipher</h3><input id="ct" value="SECURITY"><input id="ck" type="number" value="3"><button id="ce" class="btn primary">Encrypt</button><div id="co"></div></div><div class="box"><h3>Vigenère Cipher</h3><input id="vt" value="ATTACKATDAWN"><input id="vk" value="LEMON"><button id="ve" class="btn primary">Encrypt</button><div id="vo"></div></div></div></section>';ce.onclick=()=>{let k=(+ck.value%26+26)%26;co.innerHTML='<div class="trace">'+ct.value.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+k)%26+65))+'</div>'};ve.onclick=()=>{let key=vk.value.toUpperCase().replace(/[^A-Z]/g,''),i=0;vo.innerHTML='<div class="trace">'+vt.value.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+key.charCodeAt(i++%key.length)-65)%26+65))+'</div>'}}function calculations(){app.innerHTML='<section class="card"><h2>Crypto Calculations</h2><div class="grid"><div class="box"><h3>GCD</h3><input id="ga" value="252"><input id="gb" value="105"><button id="gob" class="btn primary">Compute</button><div id="go"></div></div><div class="box"><h3>Modular Power</h3><input id="base" value="3"><input id="exp" value="13"><input id="mod" value="17"><button id="mp" class="btn primary">Compute</button><div id="mout"></div></div></div></section>';gob.onclick=()=>{let a=+ga.value,b=+gb.value;while(b)[a,b]=[b,a%b];go.innerHTML='<div class="trace">GCD = '+Math.abs(a)+'</div>'};mp.onclick=()=>{let a=BigInt(base.value),e=BigInt(exp.value),m=BigInt(mod.value),r=1n;while(e){if(e&1n)r=r*a%m;a=a*a%m;e>>=1n}mout.innerHTML='<div class="trace">Result = '+r+'</div>'}}async function hashLab(){app.innerHTML='<section class="card"><h2>Hash Laboratory</h2><textarea id="hm">Security & Cryptography</textarea><button id="hb" class="btn primary">Calculate SHA-256</button><div id="ho"></div></section>';hb.onclick=async()=>{let d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(hm.value));ho.innerHTML='<div class="trace">'+[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')+'</div>'}}function scenarios(){app.innerHTML='<section class="card"><h2>Attack Scenarios</h2>'+['Replay of a payment request','Traffic analysis of encrypted messages','Modified software update','Stolen signing key','GCM nonce reuse','Credential stuffing'].map(x=>'<div class="box"><h3>'+x+'</h3><textarea placeholder="Identify property, attack class, required service, controls, and verification"></textarea></div>').join('')+'</section>'}function keyLab(){app.innerHTML='<section class="card"><h2>Key Management Lab</h2><div class="grid">'+['Generate','Establish','Store','Use','Rotate','Revoke','Archive','Destroy'].map((x,i)=>'<div class="box"><div class="big">'+(i+1)+'</div><h3>'+x+'</h3><textarea placeholder="Define controls and responsible role"></textarea></div>').join('')+'</div></section>'}function certLab(){app.innerHTML='<section class="card"><h2>Certificate Explorer</h2><p>Build a validation checklist for a website certificate.</p>'+['SAN matches domain','Validity period','Signature chain','Trust anchor','Key usage','Revocation status','Algorithm policy'].map(x=>'<label class="option"><input type="checkbox"> '+x+'</label>').join('')+'</section>'}function accessLab(){app.innerHTML='<section class="card"><h2>Access-Control Designer</h2>'+['Student','Teaching Assistant','Instructor','Administrator'].map(x=>'<div class="box"><h3>'+x+'</h3><textarea placeholder="Define permissions, MFA, least privilege, and audit events"></textarea></div>').join('')+'</section>'}function review(){let r=reports[0];app.innerHTML='<section class="card"><h2>Question Review</h2>'+(r?'<div class="box">Latest result: '+r.score+'/'+r.total+' ('+r.pct+'%)</div>':'<p>Complete an assessment to see a summary.</p>')+'</section>'}function instructor(){app.innerHTML='<section class="card"><h2>Instructor Dashboard</h2><select id="it"><option value="">All Topics</option>'+topics().map(x=>'<option>'+x+'</option>').join('')+'</select><select id="ic"><option>10</option><option selected>20</option><option>30</option></select><button id="gen" class="btn primary">Generate</button><div id="io"></div></section>';gen.onclick=()=>{let q=sample(+ic.value,it.value);io.innerHTML='<div class="box"><ol>'+q.map(x=>'<li><b>'+x.question+'</b><ol type="A">'+x.options.map(o=>'<li>'+o+'</li>').join('')+'</ol></li>').join('')+'</ol><button class="btn" onclick="print()">Print</button></div>'}}function mastery(){let a=reports.length?Math.round(reports.reduce((x,r)=>x+r.pct,0)/reports.length):0;app.innerHTML='<section class="card"><h2>Mastery</h2><div class="big">'+a+'%</div><p>Average assessment performance</p></section>'}function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2>'+topics().map(x=>'<div class="box"><h3>'+x+'</h3><p>Core vocabulary, mechanisms, assumptions, and implementation rules from this domain.</p></div>').join('')+'</section>'}function achievements(){app.innerHTML='<section class="card"><h2>Achievements</h2><div class="grid"><div class="box"><div class="big">'+(reports.length?'★':'☆')+'</div><p>First Assessment</p></div><div class="box"><div class="big">'+(reports.some(r=>r.pct>=80)?'★':'☆')+'</div><p>Security Specialist</p></div></div></section>'}function showReports(){app.innerHTML='<section class="card"><h2>Reports</h2>'+(reports.length?reports.map(r=>'<div class="box">'+r.date.toLocaleString()+' · '+r.type+' · '+r.pct+'%</div>').join(''):'<p>No completed assessments.</p>')+'</section>'}function profile(){app.innerHTML='<section class="card"><h2>Profile</h2><input placeholder="Name"><input placeholder="Student ID"><button class="btn primary">Save for session</button></section>'}fetch('./security_question_bank.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{bank=d;home()}).catch(e=>app.innerHTML='<section class="card"><h2 class="bad">Activities unavailable</h2><p>Upload security_question_bank.json beside studio.html and refresh.</p></section>');</script></body></html>
