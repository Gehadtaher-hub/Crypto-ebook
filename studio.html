<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b0914">
<title>Security & Cryptography Learning Activities</title>
<style>
:root{--deep:#3b0914;--burg:#741c32;--rose:#9f4058;--plum:#65374f;--gold:#c18c48;--blush:#f8f1f3;--paper:#fffdfd;--line:#dec9ce;--ink:#39252b;--muted:#806b70;--green:#63764a;--red:#a32638}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,Segoe UI,system-ui,sans-serif;background:radial-gradient(circle at 8% 0,#f0dce2 0,transparent 28%),radial-gradient(circle at 94% 2%,#f5e6ca 0,transparent 30%),linear-gradient(145deg,#f8f1f3,#fffdfd 52%,#f3e5e9);min-height:100vh}
header{background:linear-gradient(120deg,var(--deep),var(--burg) 62%,#91364f);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--rose),var(--gold),#f0dce2) 1;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 28px #3b091440;color:#fff}h1{margin:0;color:#fff}.kicker{color:#f1d8df;font:800 12px monospace;letter-spacing:1px}.btn,.nav,.course-nav a{border:1px solid #bf8d9a;background:#fff8fa;color:var(--deep);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px #3b091421;transition:.2s}.btn:hover,.nav:hover,.course-nav a:hover{transform:translateY(-1px);border-color:var(--gold)}.primary,.nav.active,.course-nav a.active{color:#fff;background:linear-gradient(135deg,var(--burg),var(--plum));border-color:#cf9eaa}.course-nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 72px)}aside{padding:10px;background:#f0dfe4;border-right:1px solid var(--line);overflow:auto}.nav{display:block;width:100%;text-align:left;margin:5px 0}main{width:min(1100px,100%);padding:18px;margin:auto}.card,.box,.question{background:linear-gradient(145deg,#fffdfd,#f7ebee);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 12px 28px #3b091418}.card>h2,.box>h3{color:var(--deep)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .box:nth-child(4n+1){border-top:4px solid var(--burg)}.grid .box:nth-child(4n+2){border-top:4px solid var(--rose)}.grid .box:nth-child(4n+3){border-top:4px solid var(--gold)}.grid .box:nth-child(4n){border-top:4px solid var(--plum)}.option{display:block;padding:12px;border:1px solid #c9a7b0;background:#fff8fa;border-radius:12px;margin:8px 0}.option:hover{border-color:var(--burg);background:#f3e3e7}select,input,textarea{width:100%;padding:11px;margin:6px 0;background:#fffdfd;color:var(--ink);border:1px solid #bb8a97;border-radius:10px;font-size:16px}select:focus,input:focus,textarea:focus{outline:3px solid #741c3233;border-color:var(--burg)}textarea{min-height:105px}.big{font-size:32px;color:var(--burg);font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.trace{border-left:5px solid var(--burg);background:#321018;padding:12px;margin-top:8px;font-family:ui-monospace,monospace;color:#f8edf0;border-radius:8px;overflow-wrap:anywhere}.menu{display:none}.progress{height:12px;background:#eadce0;border-radius:8px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--burg),var(--gold))}.lecture-link{display:inline-block;margin-top:7px;color:var(--burg);font-weight:800;text-decoration:none}.lecture-link:hover{text-decoration:underline}
@media(max-width:760px){header{align-items:flex-start}.layout{display:block}aside{display:none;grid-template-columns:1fr 1fr;border-right:0;border-bottom:1px solid var(--line)}aside.open{display:grid}.menu{display:inline-block}main{padding:10px}.nav{text-align:center;font-size:12px}.course-nav a{font-size:12px;padding:8px 9px}}
</style>
</head>
<body>
<header><div><h1>Learning Activities</h1><div class="kicker">DISCOVER · EXPERIMENT · MASTER</div></div><div class="course-nav"><button id="menu" class="btn menu">☰ Activities</button><a href="index.html">Ebook</a><a href="lectures.html">Lectures</a><a href="lab-manual.html">Lab Manual</a><a class="active" href="studio.html">Learning Activities</a></div></header>
<div class="layout"><aside id="nav"></aside><main id="app"><section class="card"><h2>Initializing activities…</h2></section></main></div>
<script>
'use strict';
const app=document.getElementById('app'),nav=document.getElementById('nav');let reports=[],session=null,timer=null;
const topics=['Information Security','Cryptography Fundamentals','Classical Cryptography','Crypto Mathematics','Symmetric Cryptography','Public Key Cryptography','Hash Functions','Digital Signatures & Certificates','Authentication & Access Control'];
const bank=[
{topic:'Information Security',q:'Which CIA property is primarily affected by an unauthorized grade change?',o:['Confidentiality','Integrity','Availability'],a:1,e:'Unauthorized modification violates integrity.'},
{topic:'Information Security',q:'Traffic analysis is classified as which attack type?',o:['Passive','Active','Corrective'],a:0,e:'Traffic analysis observes metadata without changing the communication.'},
{topic:'Cryptography Fundamentals',q:'According to Kerckhoffs’s principle, what should remain secret?',o:['The algorithm','The key','The ciphertext format'],a:1,e:'A cryptosystem should remain secure even when the algorithm is public; security depends on the key.'},
{topic:'Classical Cryptography',q:'A Caesar cipher is which type of classical cipher?',o:['Transposition','Monoalphabetic substitution','Hash function'],a:1,e:'Caesar replaces each letter with a shifted letter, making it substitution.'},
{topic:'Crypto Mathematics',q:'What is 3^4 mod 5?',o:['1','2','4'],a:0,e:'3^4 = 81, and 81 mod 5 = 1.'},
{topic:'Symmetric Cryptography',q:'Which AES mode provides authenticated encryption?',o:['ECB','GCM','CBC without MAC'],a:1,e:'GCM provides confidentiality and integrity when used correctly with unique nonces.'},
{topic:'Public Key Cryptography',q:'Diffie–Hellman is mainly used for:',o:['Hashing passwords','Establishing a shared secret','Compressing ciphertext'],a:1,e:'Diffie–Hellman lets parties establish shared key material over an insecure channel.'},
{topic:'Hash Functions',q:'Which property means a small input change causes a large digest change?',o:['Avalanche effect','Key escrow','Padding oracle'],a:0,e:'The avalanche effect describes large output changes caused by small input changes.'},
{topic:'Digital Signatures & Certificates',q:'What does a certificate authority primarily bind?',o:['An identity to a public key','A password to a hash','A nonce to an IV'],a:0,e:'A certificate binds identity information to a public key under the CA signature.'},
{topic:'Authentication & Access Control',q:'Which model assigns permissions based on organizational roles?',o:['RBAC','DAC only','Hash-based access'],a:0,e:'Role-Based Access Control assigns permissions to roles and users to roles.'}
];
const pages=[['Dashboard',home],['Study Notes',notes],['Guided Practice',()=>setup(false)],['Cipher Playground',ciphers],['Crypto Calculations',calculations],['Hash Laboratory',hashLab],['Attack Scenarios',scenarios],['Key Management',keyLab],['Certificate Explorer',certLab],['Access-Control Designer',accessLab],['Timed Exam',()=>setup(true)],['Reports',showReports],['Mastery',mastery],['Glossary',glossary],['Profile',profile]];
pages.forEach(([name,fn],i)=>{let b=document.createElement('button');b.className='nav'+(i?'':' active');b.textContent=name;b.onclick=()=>{clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');nav.classList.remove('open');fn()};nav.appendChild(b)});menu.onclick=()=>nav.classList.toggle('open');
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sample(n,t){return shuffle(bank.filter(x=>!t||x.topic===t)).slice(0,n)}
function home(){app.innerHTML=`<section class="card"><h2>Security Operations Dashboard</h2><p>Explore security and cryptography through guided lessons, interactive experiments, scenarios, and assessments.</p><div class="grid"><div class="box"><h3>Lecture Connection</h3><p>Review explanations, diagrams, and visual slides before attempting activities.</p><a class="lecture-link" href="lectures.html">Open Lectures →</a></div><div class="box"><h3>Cryptography Lab</h3><p>Experiment with classical ciphers, hashing, XOR, and modular arithmetic.</p></div><div class="box"><h3>Security Analysis</h3><p>Map threats to services, mechanisms, controls, and verification steps.</p></div><div class="box"><h3>Assessment</h3><p>Practice by topic, take a timed exam, and review performance.</p></div></div></section>`}
function notes(){app.innerHTML='<section class="card"><h2>Study Notes</h2>'+topics.map((t,i)=>`<div class="box"><h3>${i+1}. ${t}</h3><p>Review definitions, mechanisms, assumptions, examples, common mistakes, and implementation requirements.</p><a class="lecture-link" href="lectures.html">Open related lecture →</a></div>`).join('')+'</section>'}
function setup(exam){app.innerHTML=`<section class="card"><h2>${exam?'Timed Security Exam':'Guided Practice'}</h2><label>Topic<select id="topic"><option value="">All Topics</option>${topics.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Questions<select id="count"><option>5</option><option selected>10</option></select></label>${exam?'<label>Duration<select id="mins"><option>10</option><option selected>20</option><option>40</option></select></label>':''}<button id="start" class="btn primary">Begin</button><div id="area"></div></section>`;start.onclick=()=>{session={exam,items:sample(+count.value,topic.value),i:0,answers:[],checked:[],sec:exam?+mins.value*60:0};if(!session.items.length)return area.innerHTML='<p class="bad">No questions are available for this selection.</p>';render();if(exam)timer=setInterval(()=>{session.sec--;let c=document.getElementById('clock');if(c)c.textContent=fmt(session.sec);if(session.sec<=0)finish()},1000)}}function fmt(v){return Math.floor(Math.max(0,v)/60)+':'+String(Math.max(0,v)%60).padStart(2,'0')}
function render(){let q=session.items[session.i],opts=q.o.map((o,j)=>`<label class="option"><input type="radio" name="ans" value="${j}" ${session.answers[session.i]===j?'checked':''}> ${o}</label>`).join(''),fb=!session.exam&&session.checked[session.i]!==undefined?`<p class="${session.checked[session.i]?'good':'bad'}">${session.checked[session.i]?'Correct. ':'Try again. '}${q.e}</p>`:'';area.innerHTML=`<div class="question">${session.exam?'<span id="clock" class="big">'+fmt(session.sec)+'</span> · ':''}Question ${session.i+1} of ${session.items.length} · ${q.topic}<h2>${q.q}</h2>${opts}${fb}<div class="row"><button id="p" class="btn">Previous</button>${session.exam?'':'<button id="check" class="btn primary">Check</button>'}<button id="n" class="btn">Next</button><button id="done" class="btn">Finish</button></div></div>`;area.querySelectorAll('input').forEach(r=>r.onchange=()=>session.answers[session.i]=+r.value);p.onclick=()=>{session.i=Math.max(0,session.i-1);render()};n.onclick=()=>{session.i=Math.min(session.items.length-1,session.i+1);render()};if(!session.exam)check.onclick=()=>{if(session.answers[session.i]===undefined)return alert('Select an answer');session.checked[session.i]=session.answers[session.i]===q.a;render()};done.onclick=finish}
function finish(){clearInterval(timer);let score=session.items.reduce((s,q,i)=>s+(session.answers[i]===q.a),0),pct=Math.round(score/session.items.length*100);reports.unshift({date:new Date(),type:session.exam?'exam':'practice',score,total:session.items.length,pct});area.innerHTML=`<div class="box"><div class="big">${score} / ${session.items.length}</div><p>${pct}%</p><div class="progress"><div style="width:${pct}%"></div></div></div>`}
function clean(v){return v.toUpperCase().replace(/[^A-Z]/g,'')}
function ciphers(){app.innerHTML=`<section class="card"><h2>Cipher Playground</h2><div class="grid"><div class="box"><h3>Caesar Cipher</h3><input id="ct" value="SECURITY"><input id="ck" type="number" value="3"><div class="row"><button id="ce" class="btn primary">Encrypt</button><button id="cd" class="btn">Decrypt</button></div><div id="co"></div></div><div class="box"><h3>Vigenère Cipher</h3><input id="vt" value="ATTACKATDAWN"><input id="vk" value="LEMON"><div class="row"><button id="ve" class="btn primary">Encrypt</button><button id="vd" class="btn">Decrypt</button></div><div id="vo"></div></div><div class="box"><h3>Rail Fence Cipher</h3><input id="rt" value="WEAREDISCOVERED"><input id="rr" type="number" min="2" value="3"><button id="re" class="btn primary">Encrypt</button><div id="ro"></div></div><div class="box"><h3>Atbash Cipher</h3><input id="at" value="CONFIDENTIAL"><button id="ae" class="btn primary">Transform</button><div id="ao"></div></div><div class="box"><h3>XOR Demonstrator</h3><input id="xt" value="HELLO"><input id="xk" value="KEY"><button id="xe" class="btn primary">Apply XOR</button><div id="xo"></div></div><div class="box"><h3>Frequency Analyzer</h3><textarea id="ft">THIS IS A SAMPLE MESSAGE FOR FREQUENCY ANALYSIS</textarea><button id="fe" class="btn primary">Analyze</button><div id="fo"></div></div></div></section>`;let caesar=(t,k)=>t.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+(k%26+26)%26)%26+65));ce.onclick=()=>co.innerHTML='<div class="trace">'+caesar(ct.value,+ck.value)+'</div>';cd.onclick=()=>co.innerHTML='<div class="trace">'+caesar(ct.value,-ck.value)+'</div>';let vig=(t,k,d)=>{k=clean(k);let i=0;return k?t.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+d*(k.charCodeAt(i++%k.length)-65)+26)%26+65)):'Enter key'};ve.onclick=()=>vo.innerHTML='<div class="trace">'+vig(vt.value,vk.value,1)+'</div>';vd.onclick=()=>vo.innerHTML='<div class="trace">'+vig(vt.value,vk.value,-1)+'</div>';re.onclick=()=>{let t=clean(rt.value),r=Math.max(2,+rr.value),rows=Array.from({length:r},()=>[]),x=0,d=1;for(let c of t){rows[x].push(c);if(x===0)d=1;if(x===r-1)d=-1;x+=d}ro.innerHTML='<div class="trace">'+rows.flat().join('')+'</div>'};ae.onclick=()=>ao.innerHTML='<div class="trace">'+at.value.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode(90-(c.charCodeAt(0)-65)))+'</div>';xe.onclick=()=>{let t=new TextEncoder().encode(xt.value),k=new TextEncoder().encode(xk.value);xo.innerHTML='<div class="trace">Hex: '+[...t].map((v,i)=>(v^k[i%k.length]).toString(16).padStart(2,'0')).join(' ')+'</div>'};fe.onclick=()=>{let t=clean(ft.value),c={};for(let x of t)c[x]=(c[x]||0)+1;fo.innerHTML='<div class="trace">'+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+': '+x[1]).join('<br>')+'</div>'}}
function calculations(){app.innerHTML=`<section class="card"><h2>Crypto Calculations</h2><div class="grid"><div class="box"><h3>GCD</h3><input id="ga" value="252"><input id="gb" value="105"><button id="gob" class="btn primary">Compute</button><div id="go"></div></div><div class="box"><h3>Modular Power</h3><input id="base" value="3"><input id="exp" value="13"><input id="mod" value="17"><button id="mp" class="btn primary">Compute</button><div id="mout"></div></div></div></section>`;gob.onclick=()=>{let a=+ga.value,b=+gb.value;while(b)[a,b]=[b,a%b];go.innerHTML='<div class="trace">GCD = '+Math.abs(a)+'</div>'};mp.onclick=()=>{let a=BigInt(base.value),e=BigInt(exp.value),m=BigInt(mod.value),r=1n;while(e){if(e&1n)r=r*a%m;a=a*a%m;e>>=1n}mout.innerHTML='<div class="trace">Result = '+r+'</div>'}}
function hashLab(){app.innerHTML='<section class="card"><h2>Hash Laboratory</h2><textarea id="hm">Security & Cryptography</textarea><button id="hb" class="btn primary">Calculate SHA-256</button><div id="ho"></div></section>';hb.onclick=async()=>{let d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(hm.value));ho.innerHTML='<div class="trace">'+[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')+'</div>'}}
function scenarios(){app.innerHTML='<section class="card"><h2>Attack Scenarios</h2>'+['Replay of a payment request','Traffic analysis of encrypted messages','Modified software update','Stolen signing key','GCM nonce reuse','Credential stuffing'].map(x=>`<div class="box"><h3>${x}</h3><textarea placeholder="Identify property, attack class, required service, controls, and verification"></textarea></div>`).join('')+'</section>'}
function keyLab(){app.innerHTML='<section class="card"><h2>Key Management Lab</h2><div class="grid">'+['Generate','Establish','Store','Use','Rotate','Revoke','Archive','Destroy'].map((x,i)=>`<div class="box"><div class="big">${i+1}</div><h3>${x}</h3><textarea placeholder="Define controls and responsible role"></textarea></div>`).join('')+'</div></section>'}
function certLab(){app.innerHTML='<section class="card"><h2>Certificate Explorer</h2><p>Build a validation checklist.</p>'+['SAN matches domain','Validity period','Signature chain','Trust anchor','Key usage','Revocation status','Algorithm policy'].map(x=>`<label class="option"><input type="checkbox"> ${x}</label>`).join('')+'</section>'}
function accessLab(){app.innerHTML='<section class="card"><h2>Access-Control Designer</h2>'+['Student','Teaching Assistant','Instructor','Administrator'].map(x=>`<div class="box"><h3>${x}</h3><textarea placeholder="Define permissions, MFA, least privilege, and audit events"></textarea></div>`).join('')+'</section>'}
function showReports(){app.innerHTML='<section class="card"><h2>Reports</h2>'+(reports.length?reports.map(r=>`<div class="box">${r.date.toLocaleString()} · ${r.type} · ${r.pct}%</div>`).join(''):'<p>No completed assessments.</p>')+'</section>'}function mastery(){let a=reports.length?Math.round(reports.reduce((s,r)=>s+r.pct,0)/reports.length):0;app.innerHTML=`<section class="card"><h2>Mastery</h2><div class="big">${a}%</div><div class="progress"><div style="width:${a}%"></div></div></section>`}function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2>'+topics.map(x=>`<div class="box"><h3>${x}</h3><p>Review the core vocabulary and implementation rules in the lecture.</p></div>`).join('')+'</section>'}function profile(){app.innerHTML='<section class="card"><h2>Profile</h2><input placeholder="Name"><input placeholder="Student ID"><button class="btn primary">Save for this session</button></section>'}
home();
</script>
</body></html>
