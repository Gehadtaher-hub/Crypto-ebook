<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b2033"><title>Security & Cryptography Interactive Studio</title><style>
:root{--ink:#2b2033;--plum:#725f76;--mauve:#9c8199;--dust:#cbb0bd;--blush:#f2cbc7;--coral:#d58f89;--paper:#fff9fa;--panel:#f7edf1;--line:#e4d1da;--muted:#746a73;--green:#3d7660;--red:#a54854}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--paper),#f7e7ea 52%,#e9dce5);min-height:100vh}header{background:linear-gradient(125deg,var(--ink),var(--plum) 58%,var(--coral));color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 8px 28px #2b203344}h1{margin:0;font-size:24px}.kicker{font:800 11px monospace;letter-spacing:1.2px;color:var(--blush)}.course-nav{display:flex;gap:8px;flex-wrap:wrap}.course-nav a,.btn{border:1px solid var(--dust);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}.course-nav a.active,.btn.primary{background:linear-gradient(135deg,var(--mauve),var(--plum));color:#fff}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 82px)}aside{padding:14px;background:#f0e1e7;border-right:1px solid var(--line)}.nav{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border:1px solid var(--dust);background:#fff;border-radius:12px;color:var(--ink);font-weight:800;cursor:pointer}.nav.active{background:var(--ink);color:#fff}.small{font-size:12px;color:var(--muted)}main{width:min(1120px,100%);padding:22px;margin:auto}.hero,.card,.box{background:rgba(255,249,250,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px #2b20331c}.hero,.card{padding:22px;margin-bottom:16px}.box{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.activity{cursor:pointer;transition:.2s}.activity:hover{transform:translateY(-3px);border-color:var(--coral)}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--panel);font-size:11px;font-weight:800;color:var(--plum)}.progress{height:12px;background:#eadde3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mauve),var(--coral));width:0}.choice{display:block;padding:11px;margin:8px 0;border:1px solid var(--dust);border-radius:12px;background:#fff;cursor:pointer}.choice:hover{border-color:var(--coral)}.selected{outline:3px solid var(--coral)}.good{border-left:5px solid var(--green)!important}.bad{border-left:5px solid var(--red)!important}textarea,input,select{width:100%;padding:11px;border:1px solid var(--dust);border-radius:10px;background:#fff;margin:6px 0 12px;color:var(--ink)}.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.flow b{padding:12px;border:1px solid var(--dust);background:#fff;border-radius:12px}.arrow{color:var(--coral);font-size:22px}.result{margin-top:12px;padding:12px;border-radius:12px;background:var(--panel);min-height:45px}.score{font-size:36px;font-weight:900;color:var(--plum)}@media(max-width:780px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:14px}}

/* Exact shared site theme alignment */
body{background:radial-gradient(circle at 8% 0,rgba(242,203,199,.62),transparent 28%),radial-gradient(circle at 94% 2%,rgba(203,176,189,.55),transparent 30%),linear-gradient(145deg,#fff9fa,#f7e7ea 53%,#e9dce5)!important}
header{padding:14px 20px!important;background:linear-gradient(120deg,#2b2033,#725f76 62%,#d58f89)!important;border-bottom:3px solid #f2cbc7!important;box-shadow:0 8px 28px #2b203340!important}
.kicker{color:#f2cbc7!important;font:800 12px monospace!important;letter-spacing:1px!important}
.course-nav a{border:1px solid #cbb0bd!important;background:#fff9fa!important;color:#2b2033!important;border-radius:12px!important;padding:10px 13px!important;box-shadow:0 4px 12px #2b203321!important}
.course-nav a:hover{transform:translateY(-1px);border-color:#d58f89!important}
.course-nav a.active{color:#fff!important;background:linear-gradient(135deg,#9c8199,#725f76)!important;border-color:#f2cbc7!important}
aside{background:#f0e1e7!important;border-color:#e4d1da!important}.nav{border-color:#cbb0bd!important}.nav.active{background:#2b2033!important;color:#fff!important}.hero,.card,.box{background:rgba(255,249,250,.97)!important;border-color:#e4d1da!important}
</style></head><body><header><div><div class="kicker">SECURITY & CRYPTOGRAPHY COURSE</div><h1>Interactive Activity Studio</h1></div><nav class="course-nav"><a href="index.html">Home</a><a href="lectures.html">Lectures</a><a href="lab-manual.html">Lab Manual</a><a class="active" href="studio.html">Studio</a></nav></header><div class="layout"><aside><button class="nav active" onclick="home(this)">Course activity map</button><button class="nav" onclick="cia(this)">CIA triage</button><button class="nav" onclick="attack(this)">Attack investigator</button><button class="nav" onclick="aaa(this)">Access decision simulator</button><button class="nav" onclick="replay(this)">Replay detective</button><button class="nav" onclick="risk(this)">Risk decision room</button><button class="nav" onclick="crypto(this)">Cipher sandbox</button><button class="nav" onclick="network(this)">Secure-network builder</button><button class="nav" onclick="caseStudy(this)">Course case mission</button><button class="nav" onclick="dashboard(this)">Progress dashboard</button><hr><div class="small">Activities connect lecture concepts to decisions, experiments, models, and real scenarios. Progress is stored in this browser.</div></aside><main id="app"></main></div><script>
const app=document.getElementById('app');let state=JSON.parse(localStorage.getItem('courseStudio')||'{"done":[],"scores":{}}');const save=()=>localStorage.setItem('courseStudio',JSON.stringify(state));function active(b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function complete(id,score=100){if(!state.done.includes(id))state.done.push(id);state.scores[id]=Math.max(state.scores[id]||0,score);save()}function home(b){active(b);app.innerHTML=`<section class="hero"><span class="tag">LEARN BY DOING</span><h2>Interactive activities for the whole course</h2><p>This studio is not only a quiz area. Students investigate incidents, build security models, test cryptographic transformations, make access decisions, and justify controls.</p><div class="progress"><i style="width:${Math.round(state.done.length/8*100)}%"></i></div><p class="small">${state.done.length} of 8 core activities completed</p></section><section class="grid">${[['cia','CIA Triage','Classify the harmed security goal in real scenarios.'],['attack','Attack Investigator','Trace threat, vulnerability, attack, impact, and control.'],['aaa','Access Simulator','Make authentication and authorization decisions.'],['replay','Replay Detective','Inspect freshness evidence and reject duplicate requests.'],['risk','Risk Decision Room','Prioritize risks using likelihood and impact.'],['crypto','Cipher Sandbox','Run real browser-based Caesar and XOR experiments.'],['network','Network Builder','Place security components in the correct architecture.'],['case','Course Mission','Solve a multi-stage university security incident.']].map(x=>`<div class="box activity" onclick="${x[0]}()"><span class="tag">${state.done.includes(x[0])?'COMPLETED':'ACTIVITY'}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</section>`}
function cia(b){active(b);let q=[['A student can read another student’s grades.','Confidentiality'],['A grade changes without approval.','Integrity'],['Registration is unavailable during enrollment.','Availability']];app.innerHTML=`<section class="card"><h2>CIA Triage</h2><p>Select the primary security goal affected in each scenario.</p><div id="qs">${q.map((x,i)=>`<div class="box"><b>${i+1}. ${x[0]}</b>${['Confidentiality','Integrity','Availability'].map(v=>`<label class="choice"><input type="radio" name="c${i}" value="${v}"> ${v}</label>`).join('')}</div>`).join('')}</div><button class="btn primary" onclick='gradeCIA(${JSON.stringify(q)})'>Analyze</button><div id="out" class="result"></div></section>`}function gradeCIA(q){let n=0;q.forEach((x,i)=>{let a=document.querySelector(`input[name=c${i}]:checked`);if(a&&a.value===x[1])n++});let p=Math.round(n/q.length*100);out.textContent=`${n}/${q.length} correct. Primary analysis score: ${p}%`;if(p>=67)complete('cia',p)}
function attack(b){active(b);app.innerHTML=`<section class="card"><h2>Attack Investigator</h2><p>Incident: An attacker uses a reused password, enters a student portal, downloads records, and changes a recovery phone number.</p><div class="grid">${['Threat','Vulnerability','Attack','Impact','Control'].map(x=>`<div class="box"><b>${x}</b><select id="${x}"><option>Choose…</option><option>Account attacker</option><option>Reused password</option><option>Credential login</option><option>Privacy and integrity loss</option><option>MFA and session revocation</option></select></div>`).join('')}</div><button class="btn primary" onclick="checkAttack()">Build attack chain</button><div id="out" class="result"></div></section>`}function checkAttack(){let a=[Threat.value,Vulnerability.value,Attack.value,Impact.value,Control.value],k=['Account attacker','Reused password','Credential login','Privacy and integrity loss','MFA and session revocation'];let n=a.filter((v,i)=>v===k[i]).length;out.textContent=`${n}/5 chain elements correctly placed.`;if(n>=4)complete('attack',n*20)}
function aaa(b){active(b);app.innerHTML=`<section class="card"><h2>Access Decision Simulator</h2><p>An authenticated teaching assistant requests permission to change final grades for an unassigned course.</p><div class="flow"><b>Identity verified</b><span class="arrow">→</span><b>Role: Teaching Assistant</b><span class="arrow">→</span><b>Resource: Final grades</b></div><h3>Your decision</h3><label class="choice"><input type="radio" name="d" value="allow"> Allow because authentication succeeded</label><label class="choice"><input type="radio" name="d" value="deny"> Deny because authorization does not permit this action</label><label class="choice"><input type="radio" name="d" value="silent"> Deny but create no audit record</label><button class="btn primary" onclick="checkAAA()">Apply policy</button><div id="out" class="result"></div></section>`}function checkAAA(){let a=document.querySelector('input[name=d]:checked');if(a&&a.value==='deny'){out.textContent='Correct. Authentication proves identity; authorization checks permission; accountability records the denied attempt.';complete('aaa')}else out.textContent='Review the difference between authentication, authorization, and accountability.'}
function replay(b){active(b);app.innerHTML=`<section class="card"><h2>Replay Detective</h2><p>Compare the incoming request with the server record.</p><div class="grid"><div class="box"><h3>Captured request</h3><p>Account: 204<br>Action: Pay fee<br>Nonce: N-771<br>Timestamp: 10:42:18</p></div><div class="box"><h3>Server freshness cache</h3><p>Nonce N-771 already accepted at 10:42:18</p></div></div><select id="decision"><option>Choose decision…</option><option>Accept because the message is valid</option><option>Reject because the nonce was already used</option><option>Accept because encryption prevents replay</option></select><button class="btn primary" onclick="checkReplay()">Verify freshness</button><div id="out" class="result"></div></section>`}function checkReplay(){if(decision.value.startsWith('Reject')){out.textContent='Correct. Cryptographic validity alone is not freshness. The reused nonce identifies the replay.';complete('replay')}else out.textContent='The server must reject a valid but duplicated request.'}
function risk(b){active(b);app.innerHTML=`<section class="card"><h2>Risk Decision Room</h2><p>Set likelihood and impact for a university portal with reused passwords and no MFA.</p><div class="grid"><div><label>Likelihood</label><input id="like" type="range" min="1" max="5" value="3"></div><div><label>Impact</label><input id="impact" type="range" min="1" max="5" value="3"></div></div><select id="control"><option>Select a response…</option><option>Accept without monitoring</option><option>Mitigate with MFA, alerts, and recovery controls</option><option>Ignore because no attack has happened</option></select><button class="btn primary" onclick="calcRisk()">Evaluate decision</button><div id="out" class="result"></div></section>`}function calcRisk(){let s=+like.value*+impact.value;if(control.value.startsWith('Mitigate')){out.textContent=`Inherent risk score: ${s}/25. Mitigation is appropriate; reassess residual risk after control testing.`;complete('risk')}else out.textContent=`Inherent risk score: ${s}/25. Select a justified treatment and monitoring plan.`}
function crypto(b){active(b);app.innerHTML=`<section class="card"><h2>Cipher Sandbox</h2><p>Run an actual transformation in the browser, then reverse it.</p><label>Plaintext</label><input id="plain" value="SECURITY"><label>Caesar shift</label><input id="shift" type="number" min="0" max="25" value="3"><button class="btn primary" onclick="runCipher()">Encrypt and decrypt</button><div id="out" class="result"></div><p class="small">The activity demonstrates transformation and reversibility. It does not present Caesar cipher as modern security.</p></section>`}function runCipher(){let k=(+shift.value%26+26)%26,f=(s,d)=>s.toUpperCase().replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+d+26)%26+65));let c=f(plain.value,k),p=f(c,-k);out.innerHTML=`Ciphertext: <b>${c}</b><br>Recovered plaintext: <b>${p}</b>`;complete('crypto')}
function network(b){active(b);app.innerHTML=`<section class="card"><h2>Secure-Network Builder</h2><p>Choose the correct component for each position.</p>${[['Sender side','Security transformation'],['Across the channel','Protected message'],['Adversary position','Communication network'],['Receiver side','Verification'],['Supporting infrastructure','Key or trusted third party']].map((x,i)=>`<div class="box"><b>${x[0]}</b><select id="n${i}"><option>Choose…</option>${['Security transformation','Protected message','Communication network','Verification','Key or trusted third party'].map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')}<button class="btn primary" onclick="checkNetwork()">Test architecture</button><div id="out" class="result"></div></section>`}function checkNetwork(){let k=['Security transformation','Protected message','Communication network','Verification','Key or trusted third party'],n=k.filter((v,i)=>document.getElementById('n'+i).value===v).length;out.textContent=`${n}/5 components correctly placed.`;if(n>=4)complete('network',n*20)}
function caseStudy(b){active(b);app.innerHTML=`<section class="card"><h2>Course Case Mission</h2><p>A portal account is compromised. Complete all four investigation decisions.</p>${[['Primary weakness','Reused password'],['Affected goals','Confidentiality and integrity'],['Immediate control','Revoke sessions and reset credentials'],['Evidence for accountability','Timestamped audit log linked to the account']].map((x,i)=>`<div class="box"><b>${x[0]}</b><input id="m${i}" placeholder="Write your answer"></div>`).join('')}<button class="btn primary" onclick="checkMission()">Submit mission</button><div id="out" class="result"></div></section>`}function checkMission(){let words=[['reuse','password'],['confidential','integr'],['revoke','reset'],['audit','timestamp']],n=words.filter((w,i)=>w.some(k=>document.getElementById('m'+i).value.toLowerCase().includes(k))).length;out.textContent=`${n}/4 investigation decisions contain the expected evidence.`;if(n>=3)complete('case',n*25)}
function dashboard(b){active(b);let avg=Object.values(state.scores).length?Math.round(Object.values(state.scores).reduce((a,c)=>a+c,0)/Object.values(state.scores).length):0;app.innerHTML=`<section class="card"><h2>Progress Dashboard</h2><div class="score">${avg}%</div><p>Average score across completed activities</p><div class="progress"><i style="width:${state.done.length/8*100}%"></i></div><div class="grid" style="margin-top:16px">${['cia','attack','aaa','replay','risk','crypto','network','case'].map(x=>`<div class="box ${state.done.includes(x)?'good':''}"><b>${x.toUpperCase()}</b><p>${state.done.includes(x)?'Completed · '+(state.scores[x]||100)+'%':'Not completed'}</p></div>`).join('')}</div><button class="btn" onclick="if(confirm('Reset progress?')){localStorage.removeItem('courseStudio');location.reload()}">Reset progress</button></section>`}home(document.querySelector('.nav'));
</script></body></html>
