<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b2033">
<title>Security & Cryptography Ebook</title>
<style>
:root{--deep:#2b2033;--burg:#725f76;--rose:#9c8199;--plum:#6f5b71;--gold:#d58f89;--blush:#f2cbc7;--paper:#fffafb;--line:#e4d1da;--ink:#2b2033;--muted:#746a73}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 10% 0,#cbb0bd 0,transparent 29%),radial-gradient(circle at 92% 2%,#f2cbc7 0,transparent 27%),linear-gradient(145deg,#f2cbc7,#fffafb 55%,#eadde5)}
header{padding:14px 20px;background:linear-gradient(120deg,var(--deep),var(--burg) 62%,#d58f89);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--rose),var(--gold),#cbb0bd) 1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 8px 28px #2b203340;color:#fff}
h1{margin:0;font-size:clamp(23px,4vw,37px)}.sub{color:#f2cbc7;font:800 12px monospace;letter-spacing:1px}.actions,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,.toolbar button,.toolbar input{background:#fffafb;color:var(--deep);border:1px solid #cbb0bd;border-radius:12px;padding:10px 14px;font-weight:800;text-decoration:none;box-shadow:0 5px 14px #2b203321;transition:.2s}.btn:hover,.toolbar button:hover{transform:translateY(-2px);border-color:var(--gold)}.btn.active{color:#fff;background:linear-gradient(135deg,var(--burg),var(--plum));border-color:#d58f89}.btn.lab{color:#fff;background:linear-gradient(135deg,#8f3048,var(--burg));border-color:#c58d9b}
main{padding:10px}.toolbar{justify-content:center;margin-bottom:8px;color:var(--muted)}.toolbar input{width:72px}.shell{width:min(1400px,100%);height:calc(100vh - 155px);min-height:430px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}.flip-book{display:none;filter:drop-shadow(0 20px 30px #2b203355)}.page{background:#fff;overflow:hidden;position:relative;border-radius:3px;box-shadow:0 16px 32px #2b20332e}.page canvas{width:100%;height:100%;object-fit:contain}.link-layer{position:absolute;inset:0}.pdf-link{position:absolute;border:0;background:transparent;cursor:pointer}.pdf-link:hover,.pdf-link:focus{background:#d58f8938;outline:2px solid var(--gold)}
.loading{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:32px;text-align:center;box-shadow:0 12px 30px #2b203320}.spinner{width:42px;height:42px;margin:auto;border:4px solid #d8bfc5;border-top-color:var(--burg);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){header{padding:10px}.shell{height:calc(100vh - 235px)}.hint{display:none}.btn,.toolbar button{padding:9px 11px;font-size:12px}}

/* True full-page PDF viewer: one complete page at a time */
.shell{width:100%;height:calc(100vh - 155px);min-height:430px;overflow:auto!important;display:flex;align-items:flex-start;justify-content:center;padding:0 12px 22px}
.flip-book{display:none;width:min(1120px,100%);filter:none!important}
.page{width:100%;height:auto!important;background:#fff;border-radius:8px;box-shadow:0 16px 36px #2b203338;overflow:hidden;position:relative}
.page canvas{display:block;width:100%!important;height:auto!important;object-fit:contain}
.link-layer{position:absolute;inset:0}
@media(max-width:700px){.shell{height:calc(100vh - 235px);padding:0 4px 14px}.page{border-radius:4px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header>
  <div><h1>Security & Cryptography</h1><div class="sub">INTERACTIVE EBOOK · CLICKABLE CONTENTS</div></div>
  <nav class="actions" aria-label="Course navigation">
    <a class="btn active" href="index.html">Ebook</a>
    <a class="btn" href="lectures.html">Lectures</a>
    <a class="btn lab" href="lab-manual.html">Lab Manual</a>
    <a class="btn" href="studio.html">Learning Activities</a>
  </nav>
</header>
<main>
  <div class="toolbar">
    <button id="prev" disabled>← Previous</button>
    <span id="status">Loading…</span>
    <span class="hint">Contents and embedded links are clickable</span>
    <button id="next" disabled>Next →</button>
    <label>Page <input id="pageNo" type="number" min="1" value="1" disabled></label>
  </div>
  <div class="shell">
    <div id="loading" class="loading"><div class="spinner"></div><p>Loading interactive pages…</p></div>
    <div id="book" class="flip-book"><div id="singlePage" class="page"><canvas id="pageCanvas"></canvas><div id="linkLayer" class="link-layer"></div></div></div>
  </div>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const file='crypto_ebook.pdf';
const root=document.getElementById('book'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),pageNo=document.getElementById('pageNo'),prev=document.getElementById('prev'),next=document.getElementById('next'),canvas=document.getElementById('pageCanvas'),layer=document.getElementById('linkLayer');
let doc,total=0,current=1,rendering=false,pending=null;
async function renderPage(n){
 if(rendering){pending=n;return} rendering=true; current=n; pageNo.value=n; statusEl.textContent='Page '+n+' of '+total;
 const pg=await doc.getPage(n),base=pg.getViewport({scale:1}),available=Math.min(1100,Math.max(320,document.documentElement.clientWidth-28)),scale=Math.max(1.25,available/base.width),vp=pg.getViewport({scale}),ratio=window.devicePixelRatio||1;
 canvas.width=Math.ceil(vp.width*ratio);canvas.height=Math.ceil(vp.height*ratio);canvas.style.aspectRatio=vp.width+'/'+vp.height;
 const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);await pg.render({canvasContext:ctx,viewport:vp}).promise;
 layer.innerHTML='';const anns=await pg.getAnnotations();anns.filter(a=>a.subtype==='Link').forEach(a=>{const r=vp.convertToViewportRectangle(a.rect),l=Math.min(r[0],r[2]),t=Math.min(r[1],r[3]),w=Math.abs(r[2]-r[0]),h=Math.abs(r[3]-r[1]),el=document.createElement('a');el.className='pdf-link';el.style.cssText=`left:${l/vp.width*100}%;top:${t/vp.height*100}%;width:${w/vp.width*100}%;height:${h/vp.height*100}%`;if(a.url){el.href=a.url;el.target='_blank';el.rel='noopener'}else if(a.dest){el.href='#';el.onclick=async e=>{e.preventDefault();let d=typeof a.dest==='string'?await doc.getDestination(a.dest):a.dest;if(d)renderPage((await doc.getPageIndex(d[0]))+1)}}layer.appendChild(el)});
 prev.disabled=n<=1;next.disabled=n>=total;rendering=false;if(pending){let x=pending;pending=null;renderPage(x)}
}
(async()=>{try{doc=await pdfjsLib.getDocument(file).promise;total=doc.numPages;pageNo.max=total;pageNo.disabled=false;root.style.display='block';loading.style.display='none';await renderPage(1)}catch(e){loading.innerHTML='<h2>Ebook initialization failed</h2><p>Keep <b>crypto_ebook.pdf</b> beside <b>index.html</b>.</p><small>'+e.message+'</small>'}})();
prev.onclick=()=>current>1&&renderPage(current-1);next.onclick=()=>current<total&&renderPage(current+1);pageNo.onchange=()=>renderPage(Math.max(1,Math.min(total,+pageNo.value||1)));let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>doc&&renderPage(current),180)});
</script>
</body>
</html>
