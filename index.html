<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111f"><title>Security & Cryptography Ebook</title><style>
:root{--ink:#edf6ff;--navy:#101d33;--navy2:#172a46;--blue:#4f8cff;--cyan:#38c6d9;--violet:#8b7cf6;--gold:#e7b85c;--panel:#16263e;--line:#3e5a78;--muted:#b6c8dc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--ink)}

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><h1>Security & Cryptography</h1><div class="sub">INTERACTIVE EBOOK · CLICKABLE CONTENTS</div></div><div class="actions"><a class="btn active" href="index.html">Ebook</a><a class="btn lab" href="lab-manual/">🧪 Lab Manual</a><a class="btn" href="studio.html">Learning Activities</a></div></header><main><div class="toolbar"><button id="prev" disabled>← Previous</button><span id="status">Loading…</span><span class="hint">Contents and embedded links are clickable</span><button id="next" disabled>Next →</button><label>Page <input id="pageNo" type="number" min="1" value="1" disabled></label></div><div class="shell"><div id="loading" class="loading"><div class="spinner"></div><p>Loading interactive pages…</p></div><div id="book" class="flip-book"></div></div></main><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file='Security & Cryptography Ebook.pdf',root=document.getElementById('book'),loading=document.getElementById('loading'),statusEl=document.getElementById('status');let doc,flip,total=0;async function destPage(dest){try{let d=typeof dest==='string'?await doc.getDestination(dest):dest;if(!d)return null;return typeof d[0]==='object'?(await doc.getPageIndex(d[0]))+1:(Number.isInteger(d[0])?d[0]+1:null)}catch{return null}}async function links(pg,holder,vp){let anns=await pg.getAnnotations({intent:'display'}),layer=document.createElement('div');layer.className='link-layer';for(const a of anns){if(a.subtype!=='Link'||!a.rect)continue;let r=vp.convertToViewportRectangle(a.rect),x=Math.min(r[0],r[2]),y=Math.min(r[1],r[3]),b=document.createElement('button');b.className='pdf-link';b.style.left=x/vp.width*100+'%';b.style.top=y/vp.height*100+'%';b.style.width=Math.abs(r[2]-r[0])/vp.width*100+'%';b.style.height=Math.abs(r[3]-r[1])/vp.height*100+'%';b.onclick=async e=>{e.stopPropagation();if(a.url)window.open(a.url,'_blank','noopener');else{let p=await destPage(a.dest);if(p)flip.flip(p-1)}};layer.appendChild(b)}holder.appendChild(layer)}(async()=>{try{doc=await pdfjsLib.getDocument(file).promise;total=doc.numPages;pageNo.max=total;for(let n=1;n<=total;n++){statusEl.textContent='Preparing page '+n+' of '+total;let pg=await doc.getPage(n),vp=pg.getViewport({scale:1.3}),c=document.createElement('canvas'),d=document.createElement('div');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);await links(pg,d,vp);root.appendChild(d)}loading.style.display='none';root.style.display='block';flip=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:250,maxWidth:650,minHeight:340,maxHeight:780,showCover:true,usePortrait:true,mobileScrollSupport:false,drawShadow:true,flippingTime:650});flip.loadFromHTML(root.querySelectorAll('.page'));flip.on('flip',e=>{pageNo.value=e.data+1;statusEl.textContent='Page '+(e.data+1)+' of '+total});prev.disabled=next.disabled=pageNo.disabled=false;statusEl.textContent='Page 1 of '+total}catch(e){loading.innerHTML='<h2>Reader initialization failed</h2><p>Keep the PDF beside index.html and publish through GitHub Pages.</p><small>'+e.message+'</small>'}})();prev.onclick=()=>flip&&flip.flipPrev();next.onclick=()=>flip&&flip.flipNext();pageNo.onchange=()=>flip&&flip.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1);</script></body></html>
